name: Mobile App Checks

on:
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-app-checks.yml'
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest

      - name: Check types
        if: always()
        run: npx tsc --noEmit

      - name: Lint (does not fail the build)
        if: always()
        continue-on-error: true
        run: npx expo lint
