name: Secret scanning
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned scanner
        run: bash scripts/security/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      - name: Prove synthetic credential is rejected
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: python3 scripts/security/scan.py --probe
      - name: Scan checked-out tree and reachable history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: python3 scripts/security/scan.py --ref HEAD
      # Raw scanner reports and diagnostics must never be uploaded.
      - name: Upload sanitised metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitised-secret-scan
          path: security-evidence/scan.json
          if-no-files-found: ignore
          retention-days: 7
